name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment URL to test
        required: false
        default: https://fpl-dashboard-seven-pi.vercel.app
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: ${{ inputs.base_url || 'https://fpl-dashboard-seven-pi.vercel.app' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check production readiness
        run: node scripts/smoke-production.mjs
