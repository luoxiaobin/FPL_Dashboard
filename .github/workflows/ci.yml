name: CI/CD Pipeline

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Reject tracked Playwright authentication state
      run: |
        test -z "$(git ls-files playwright/.auth)"
        git check-ignore -q playwright/.auth/fpl.json

    - name: Run Linter
      run: npm run lint

    - name: Quick Regression (Unit Tests)
      run: npm run test

    - name: Build Application
      run: npm run build
